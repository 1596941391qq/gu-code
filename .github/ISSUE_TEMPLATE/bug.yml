name: bug
description: 哪里坏了
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、看到了什么、本来应该怎样
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: 在哪里玩的
      placeholder: 例如 网页版 / iPhone Safari / VS Code 1.142 插件
    validations: { required: true }
  - type: textarea
    id: code
    attributes:
      label: 坐标码或复盘链接（可选）
      description: 有的话贴上，方便复现那场战斗
